# Flow: Error state – generation failure
# Prerequisite: staging API is configured to return a "failed" status for
# a specific prompt (or the test env has a mock that always fails).
# Use the magic prompt below which the test API will force to fail.
# Expected result: app shows a user-friendly error message with a retry option.

appId: xyz.opensora.app
---
- launchApp

- assertVisible: 'Generate'
- tapOn: 'Generate'

- tapOn:
    id: 'prompt-input'
# This magic prompt is intercepted by the staging mock to simulate a failure
- inputText: '__force_failure_smoke_test__'

- tapOn: 'Generate Video'

# Wait for the job to transition to a failed state
- waitForAnimationToEnd:
    timeout: 30000

# The UI must show an error state
- assertVisible: 'Generation failed'

# A retry button must be available
- assertVisible: 'Try Again'
